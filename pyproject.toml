[build-system]
requires = ["setuptools>=74.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tyle"
version = "0.2.0"
description = "TYLE (Tiled Inference Layout Encoding): a CPU-native single-file model format for local LLM inference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = ["llm", "inference", "model-format", "cpu", "quantization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://csp.gitbook.io/genai/foss/tyle"

[tool.setuptools]
packages = ["tyle"]

[tool.setuptools.package-data]
tyle = ["src/*.cpp", "src/*.h"]

[[tool.setuptools.ext-modules]]
name = "tyle._amxpack"
sources = ["tyle/src/tyle_pack.cpp"]
language = "c++"
